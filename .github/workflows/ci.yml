name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stack:
    # MongoDB 8.3.11 refuses to start on Linux 6.19 or newer (SERVER-121912),
    # which ubuntu-24.04 runners now use. Keep this pin until the image is fixed.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Lint (fast fail before building images)
        run: |
          pipx run ruff==0.17.1 check .
          pipx run ruff==0.17.1 format --check .

      - name: Create .env with throwaway secrets
        run: |
          python3 - <<'EOF'
          import re, secrets
          text = open(".env.example").read()
          text = re.sub(r"change-me[\w-]*", lambda m: secrets.token_urlsafe(24), text)
          open(".env", "w").write(text)
          EOF

      - name: Build, start databases and run migrate
        run: |
          docker compose build
          docker compose run --rm migrate

      - name: Load the committed sample into both databases
        run: docker compose run --rm etl python -m etl.pipeline --sample

      - name: Start the web app
        run: docker compose up -d --wait --wait-timeout 300 web

      - name: Servers run as non-root (PID 1 of postgres, mongodb and web)
        # Reads the real and effective UID of PID 1. "exec ... id -u" is not used: it runs as the image's
        # default user (root for postgres), although the server itself runs as UID 999. The MongoDB image
        # has no grep, so the file is read inside the container and filtered on the host.
        run: |
          for svc in postgres mongodb web; do
            line=$(docker compose exec -T "$svc" cat /proc/1/status | grep Uid)
            echo "$svc: $line"
            set -- $line
            if [ -z "$3" ] || [ "$2" = 0 ] || [ "$3" = 0 ]; then
              echo "$svc: PID 1 runs as root (real $2, effective $3)"
              exit 1
            fi
          done

      - name: Tests (unit + integration against the running stack)
        run: |
          set -a; . ./.env; set +a
          docker compose run --rm --no-deps -e NEIGHBOAR_URL=http://web:8000 -e PG_APP_RO_PASSWORD -e PG_OWNER_PASSWORD -e MONGO_ETL_PASSWORD -e DEMO_BUYER_PASSWORD -e DEMO_ADMIN_PASSWORD web python -m pytest -q -m "integration or not integration"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
